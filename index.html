<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tracker Tabs</title>
<meta name="description" content="Personal trackers that plot over time, as bars, or as xy points. Everything stays on this device.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEF2F0">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10171A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
[hidden]{display:none!important}
</style>
<style>
/* Layout: phone-first single column. Sticky control bar (menu left; Save and Table/Plot toggle right), content below.
   Look: graph-paper ground, pen-blue accent, mono numerals for data. */
:root{
  --paper:#EEF2F0;
  --card:#FAFCFB;
  --card-2:#EBF0ED;
  --field:#FFFFFF;
  --ink:#16211F;
  --ink-2:#4A5A56;
  --line:#CBD5D1;
  --grid:#E0E7E4;
  --accent:#2B49C9;
  --on-accent:#FFFFFF;
  --accent-soft:#E2E7FA;
  --rainbow:linear-gradient(90deg,#FF5A5F,#FF9A3C,#FFD23F,#3DD68C,#3BB4F2,#6C7CFF,#B15CFF);
  --danger:#B3372B;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --data:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10171A;--card:#182125;--card-2:#1F2A2E;--field:#0E1417;--ink:#E6EEEB;--ink-2:#9AACA7;
    --line:#2D3B40;--grid:#223034;--accent:#8CA4FF;--on-accent:#0A1128;--accent-soft:#222D52;--danger:#F28B7F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10171A;--card:#182125;--card-2:#1F2A2E;--field:#0E1417;--ink:#E6EEEB;--ink-2:#9AACA7;
  --line:#2D3B40;--grid:#223034;--accent:#8CA4FF;--on-accent:#0A1128;--accent-soft:#222D52;--danger:#F28B7F;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);
  font:16px/1.4 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 56px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h1{font-size:26px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere;min-width:0}
h2{font-size:12px;margin:0;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
p{margin:0}
.sub{color:var(--ink-2);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* control bar */
.barwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar{max-width:560px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px}
.topbar .right{display:flex;align-items:center;gap:8px;min-width:0}
.topbar .btn{min-height:40px;padding:0 12px;font-size:15px}
.menuwrap{position:relative}
.menu{position:absolute;left:0;top:calc(100% + 6px);min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 10px 28px rgba(8,14,13,.18);display:flex;flex-direction:column;gap:2px}
.menu button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:0;border-radius:8px;background:none;text-align:left;font-weight:600}
.menu button:hover{background:var(--card-2)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2);padding:0 6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn.icon{width:44px;padding:0}
.btn.ghost{border-color:transparent;background:none}
.btn.big{width:100%;min-height:56px;font-size:18px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-align:left}

/* layout */
.col{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:16px;padding-top:16px}
.head{display:flex;flex-direction:column;gap:2px;min-width:0}
.titlerow{display:flex;align-items:center;gap:4px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.warn,.err{color:var(--danger);font-size:14px}

/* home */
.tabs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tabs li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabopen{display:flex;align-items:center;gap:12px;min-height:56px;padding:4px 8px;background:none;border:0;border-radius:8px;text-align:left;min-width:0}
.tabopen .tx{display:flex;flex-direction:column;min-width:0}
.tabopen .nm{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabopen .meta{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs .btn.icon{min-height:44px;width:40px;color:var(--ink-2)}
.glyph{flex:none;width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.draft{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.draft .dt{display:flex;flex-direction:column}
.draft .dbtn{display:flex;gap:8px}
.draft .btn{min-height:40px}

/* new */
.types{display:flex;flex-direction:column;gap:10px}
.type{display:flex;align-items:flex-start;gap:14px;width:100%;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:left;min-height:72px}
.type .tt{display:block;font-weight:700}
.type .td{display:block;margin-top:2px;font-size:13px;color:var(--ink-2)}
.tpl{align-self:flex-start}
.soon{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:var(--card-2);color:var(--ink-2)}

/* fields */
input[type=text],input[type=number],input[type=date],.entry select,.fl select{
  font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);
  border-radius:8px;min-height:44px;padding:0 10px;width:100%;min-width:0;
}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
textarea{font:12px/1.4 var(--data);width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);resize:vertical}
.axes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.axes label{display:flex;flex-direction:column;gap:4px;min-width:0}
.cap{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.axtag{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;background:var(--accent);color:var(--on-accent);font:700 11px var(--data);letter-spacing:0}
.hint{font-size:12px;color:var(--ink-2)}

/* data table */
.tablewrap{max-height:min(48vh,340px);overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);width:fit-content;max-width:100%}
table.grid{border-collapse:separate;border-spacing:0}
.grid th{position:sticky;top:0;z-index:1;background:var(--card-2);font-size:12px;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid th .axtag{margin-right:6px}
.grid th .hn{display:inline-block;max-width:92px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;font-weight:700}
.grid td{padding:0;border-bottom:1px solid var(--grid)}
.grid tr:last-child td{border-bottom:0}
.grid .n{width:30px;text-align:center;color:var(--ink-2);font:12px var(--data);padding:0}
.grid td:nth-child(2){width:138px}
.grid td:nth-child(3){width:104px}
.grid .d{width:36px;text-align:center;padding:0}
.grid td input{width:100%;min-height:42px;border:0;border-radius:0;background:transparent;padding:0 8px;font:15px var(--data)}
.grid td input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--field)}
.xbtn{width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--ink-2);display:inline-grid;place-items:center}
.xbtn.off{visibility:hidden}
.grid td select{width:100%;min-height:42px;border:0;border-radius:0;background:transparent;color:var(--ink);padding:0 4px;font:15px var(--ui)}
.grid td select:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--field)}
.grid.rt td:nth-child(3){width:132px}
.axes .lv,.axes .fl{grid-column:1/-1}
.hint.err{color:var(--danger)}
.plotbar{display:flex;justify-content:flex-end}
.plotbar .btn{min-height:40px;padding:0 12px;font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink-2)}
.legend:empty{display:none}
.lg{display:inline-flex;align-items:center;gap:6px}
.lgm{display:inline-block;width:14px;height:14px;border-radius:50%;border:3px solid transparent;box-sizing:border-box;flex:none}
.edit{gap:14px}
.edhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.edhead .btn{min-height:40px}
.sb{display:flex;flex-direction:column;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card-2)}
.sbhead{display:flex;align-items:center;gap:6px}
.sbhead .sn{flex:1;min-width:0;display:block}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.colors{display:flex;flex-wrap:wrap;gap:12px 20px}
.cf{display:flex;align-items:flex-end;gap:8px}
.cl{display:flex;flex-direction:column;gap:4px}
input[type=color]{width:56px;height:44px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--field);cursor:pointer}
.rng{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rng label{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0}
.entry .ser{grid-column:1/-1}
.grid.xyt td:nth-child(2),.grid.xyt td:nth-child(3){width:84px}
.grid.xyt td:nth-child(4){width:112px}
.glyph.rb{background:var(--rainbow);color:#fff}
.head.rb::after{content:"";display:block;height:5px;border-radius:3px;background:var(--rainbow);margin-top:8px}
.chart.rb::before{content:"";display:block;height:6px;margin:-12px -12px 10px;background:var(--rainbow)}
.cyc{display:flex;flex-direction:column;gap:10px;overflow:hidden}
.cyc.rb::before{content:"";display:block;height:6px;margin:-12px -12px 2px;background:var(--rainbow)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.stats:empty{display:none}
.stat{display:flex;flex-direction:column;gap:2px;padding:8px 10px;background:var(--card-2);border-radius:10px;min-width:0}
.sv{font:700 22px/1.1 var(--data)}
.sl{font-size:12px;color:var(--ink-2)}
.cychost{min-width:0}
.lgsq{display:inline-block;width:14px;height:14px;border-radius:3px;flex:none}

/* plot view */
.chart{padding:12px;overflow:hidden}
.chart-svg{display:block;max-width:100%;height:auto}
.nochart{padding:36px 8px;text-align:center;color:var(--ink-2)}
.readout{font:13px var(--data);color:var(--ink-2);min-height:20px}
.entry{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 48px;gap:8px;align-items:end}
.entry .f{display:flex;flex-direction:column;gap:4px;min-width:0}
.entry .cap2{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .add{width:48px;min-height:44px;padding:0}
.entry input[type=date]{padding:0 6px}

/* chart marks */
.c-gl{stroke:var(--grid);stroke-width:1}
.c-ax{stroke:var(--ink-2);stroke-width:1.2}
.c-tk{font:11px var(--data);fill:var(--ink-2)}
.c-an{font:600 12px var(--ui);fill:var(--ink)}
.c-vl{font:600 10.5px var(--data);fill:var(--ink)}
.c-ln{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.c-ar{fill:var(--accent);fill-opacity:.12;stroke:none}
.c-pt{fill:var(--card);stroke:var(--accent);stroke-width:2}
.c-pt.last{fill:var(--accent)}
.c-dot{fill:var(--accent);fill-opacity:.78;stroke:var(--card);stroke-width:1.5}
.c-bar{fill:var(--accent);fill-opacity:.88;stroke:none}
.c-bar.sel{stroke:var(--ink);stroke-width:2}
.c-ring{fill:none;stroke:var(--ink);stroke-width:1.6}
[data-act="pt"]{cursor:pointer}

/* dialog + toast */
.scrim{position:fixed;inset:0;background:rgba(8,14,13,.5);z-index:50}
.sheet{position:fixed;z-index:51;top:max(72px,16vh);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));margin-inline:auto;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 48px rgba(8,14,13,.3)}
.sheet .dt{font-size:18px;letter-spacing:0;text-transform:none;color:var(--ink)}
.sheet .dm{color:var(--ink-2);font-size:15px}
.dbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;z-index:60;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.menu,.sheet{animation:pop .12s ease-out}}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="dlg" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
'use strict';

/* ---------- config ---------- */
var KEY='tracker-tabs.v1';
var DEFAULT_LEVELS=['Bad','OK','Good'];
var CID='',CACT='pt';
var RB=['#FF5A5F','#FF9A3C','#FFD23F','#3DD68C','#3BB4F2','#6C7CFF','#B15CFF'];
var TEMPLATES={
  period:{name:'Period tracker',type:'rating',xName:'Date',yName:'Flow',levels:['None','Light','Medium','Heavy'],rainbow:true,floor:true,
    blurb:'Log flow each day as none, light, medium or heavy. Drawn as a rainbow line with shading underneath.'},
  weight:{name:'Weight tracker',type:'time',xName:'Date',yName:'Weight (kg)',
    blurb:'Log your weight each day. Drawn as a line over time. Rename the axis if you prefer pounds.'}
};
var TYPES={
  time:{title:'Track something over time',blurb:'Dates along the bottom, a number up the side. Drawn as a line.',x:'Date',y:'Value',
        xHint:'Horizontal · dates',yHint:'Vertical · number',short:'Line',
        rowMsg:'Fill in at least one row with a date and a number.',entryMsg:'Pick a date and enter a number.'},
  rating:{title:"Track how you're doing over time",blurb:'Pick a rating for each day, like bad, ok or good. Drawn as a line.',x:'Date',y:'How you feel',
        xHint:'Horizontal · dates',yHint:'Vertical · your levels',short:'Ratings',
        rowMsg:'Fill in at least one row with a date and a rating.',entryMsg:'Pick a date and a rating.'},
  bars:{title:'Track how much of something you have or have done',blurb:'Name each item and give it an amount. Drawn as bars.',x:'Item',y:'Amount',
        xHint:'Horizontal · item names',yHint:'Vertical · number',short:'Bars',
        rowMsg:'Fill in at least one row with a name and a number.',entryMsg:'Enter a name and a number.'},
  xy:{title:'Plot anything xy',blurb:'Two numbers per row. Drawn as a scatter plot.',x:'X',y:'Y',
      xHint:'Horizontal · number',yHint:'Vertical · number',short:'Scatter',
      rowMsg:'Fill in at least one row with two numbers.',entryMsg:'Enter two numbers.'}
};

/* ---------- state ---------- */
var store={tabs:[],draft:null};
var ui={view:'home',mode:'table',cur:null,sel:null,pts:[],storageOk:true};

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36);}
function pad2(n){return String(n).padStart(2,'0');}
function isoLocal(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function today(){return isoLocal(new Date());}
function dayNum(s){var p=s.split('-').map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/864e5);}
function fmtDay(n,o){return new Date(n*864e5).toLocaleDateString(undefined,Object.assign({timeZone:'UTC'},o));}
function fmtNum(n){return new Intl.NumberFormat(undefined,{maximumFractionDigits:4}).format(n);}
function trunc(s,n){s=String(s);return s.length>n?s.slice(0,Math.max(1,n-1))+'…':s;}
function toTop(){try{window.scrollTo(0,0);}catch(e){}}
function xn(t){return (t.xName||'').trim()||TYPES[t.type].x;}
function yn(t){return (t.yName||'').trim()||TYPES[t.type].y;}
function rowBlank(r){return String(r.x).trim()===''&&String(r.y).trim()==='';}
function hasData(t){return t.rows.some(function(r){return !rowBlank(r);});}
function ensureTrailingBlank(t){if(!t.rows.length||!rowBlank(t.rows[t.rows.length-1]))t.rows.push({x:'',y:''});}
function entryCount(t){return t.rows.filter(function(r){return !rowBlank(r);}).length;}

/* ---------- storage ---------- */
var PALETTE=['#E07B00','#12935F','#C23B8F','#7A57D1','#0E9AA7','#C9482B'];
var HEX=/^#[0-9a-fA-F]{6}$/;
function newSeries(i,type){return {id:uid(),name:'Series '+(i+1),color:null,mcolor:null,line:type==='time'||type==='rating'};}
function seriesOf(t,r){
  if(t.type!=='xy'||!r.s)return 0;
  for(var j=0;j<t.series.length;j++){if(t.series[j].id===r.s)return j;}
  return -1;
}
function sname(t,k){return (t.series[k].name||'').trim()||('Series '+(k+1));}
function lineColor(t,k){return t.series[k].color||(k===0?'var(--accent)':PALETTE[(k-1)%PALETTE.length]);}
function markColor(t,k){return t.series[k].mcolor||lineColor(t,k);}
function hexOf(c){
  if(c.indexOf('var(')===0){
    var v='';
    try{v=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();}catch(e){}
    return HEX.test(v)?v.toLowerCase():'#2b49c9';
  }
  return c.toLowerCase();
}
function clean(t){
  if(!t||typeof t!=='object'||!TYPES[t.type])return null;
  var type=t.type;
  var series=(Array.isArray(t.series)?t.series:[]).slice(0,6).map(function(s,i){
    s=(s&&typeof s==='object')?s:{};
    return {id:(typeof s.id==='string'&&s.id)?s.id.slice(0,24):uid(),name:String(s.name==null?('Series '+(i+1)):s.name).slice(0,30),
      color:HEX.test(s.color)?s.color:null,mcolor:HEX.test(s.mcolor)?s.mcolor:null,line:!!s.line};
  });
  if(!series.length)series=[newSeries(0,type)];
  if(type!=='xy')series=series.slice(0,1);
  var ids=Object.create(null);
  series.forEach(function(s){ids[s.id]=1;});
  var rows=Array.isArray(t.rows)?t.rows.map(function(r){
    return {x:r&&r.x!=null?String(r.x):'',y:r&&r.y!=null?String(r.y):'',s:(r&&typeof r.s==='string'&&ids[r.s])?r.s:undefined};
  }):[];
  var v=(t.view&&typeof t.view==='object')?t.view:{};

  else{if(xs==='')return {bad:true};x=Number(xs);if(!isFinite(x))return {bad:true};}
  if(ys==='')return {bad:true};
  var y=Number(ys);if(!isFinite(y))return {bad:true};

function getPlot(t){
  var pts=[],bad=0;
  t.rows.forEach(function(r,i){
    var p=parseRow(t,r);

    if(p.bad){bad++;return;}
    var k=seriesOf(t,r);if(k<0)return;
    pts.push({i:i,x:p.x,y:p.y,xs:p.xs,k:k});
  });
  if(t.type==='time'||t.type==='rating')pts.sort(function(a,b){return a.x-b.x||a.i-b.i;});
  if(t.type==='bars'){
    var seen=Object.create(null),merged=[];
    pts.forEach(function(p){
      var k=p.xs.toLowerCase(),e=seen[k];
      if(e){e.y=t.mode==='latest'?p.y:Math.round((e.y+p.y)*1e9)/1e9;e.n++;}
      else{e={i:p.i,x:p.x,y:p.y,xs:p.xs,n:1};seen[k]=e;merged.push(e);}

}

  var seen={},out=[];
  t.rows.forEach(function(r){var s=String(r.x).trim();if(s&&!seen[s]&&out.length<50){seen[s]=1;out.push(s);}});

}

/* ---------- chart math ---------- */
function niceNum(r,round){
  var e=Math.floor(Math.log10(r)),f=r/Math.pow(10,e),n;
  if(round){n=f<1.5?1:f<3?2:f<7?5:10;}else{n=f<=1?1:f<=2?2:f<=5?5:10;}
  return n*Math.pow(10,e);
}
function niceScale(min,max,count){
  if(min===max){var p=Math.abs(min)*0.1||1;min-=p;max+=p;}
  var range=niceNum(max-min,false),step=niceNum(range/(count-1),true);
  var lo=Math.floor(min/step+1e-9)*step,hi=Math.ceil(max/step-1e-9)*step;
  var n=Math.max(1,Math.round((hi-lo)/step)),ticks=[];
  for(var i=0;i<=n;i++)ticks.push(lo+i*step);
  return {lo:lo,hi:hi,ticks:ticks};
}
function timeTicks(lo,hi){
  var span=hi-lo,ticks=[],i;
  if(span<=100){
    var steps=[1,2,3,7,14,21,30],step=30;
    for(i=0;i<steps.length;i++){if(span/steps[i]<=4){step=steps[i];break;}}
    for(var t=Math.ceil(lo/step)*step;t<=hi;t+=step)ticks.push(t);
  }else{
    var ms=[1,2,3,6,12,24,60],months=span/30.44,m=60;
    for(i=0;i<ms.length;i++){if(months/ms[i]<=4){m=ms[i];break;}}
    var d=new Date(lo*864e5),y=d.getUTCFullYear(),mo=d.getUTCMonth();
    var idx=y*12+mo;

      var td=Math.round(Date.UTC(Math.floor(idx/12),idx%12,1)/864e5);
      if(td>hi)break;

    }

  return s+'</svg>';
}

function periodStarts(t){
  var g=getPlot(t).pts.slice().sort(function(a,b){return a.x-b.x||a.i-b.i;});
  var days=[],last=null;
  g.forEach(function(p){
    if(last&&last.x===p.x)last.y=p.y;
    else{last={x:p.x,y:p.y};days.push(last);}
  });
  var starts=[];
  for(var i=1;i<days.length;i++){
    if(days[i-1].y===1&&days[i].y>1){
      var j=i;
      while(j+1<days.length&&days[j+1].y>1)j++;
      starts.push({x:days[i].x,dur:days[j].x-days[i].x+1});
    }
  }
  return starts;
}
function meanOf(a){return Math.round(a.reduce(function(x,y){return x+y;},0)/a.length*10)/10;}
function cyTile(v,label){return '<div class="stat"><span class="sv">'+esc(v)+'</span><span class="sl">'+esc(label)+'</span></div>';}
function cycleSection(t){
  if(t.tpl!=='period')return '';
  return '<section class="card cyc'+(rbOn(t)?' rb':'')+'" aria-label="Cycle length"><h2>Cycle length</h2>'+
    '<p class="sub">A cycle starts on a day when flow goes from '+esc(t.levels[0])+' to anything higher. Bars show the days from that start to the next one. The line shows how many days the flow lasted.</p>'+
    '<div id="cycStats" class="stats"></div><div id="cycHost" class="cychost"></div><div class="legend" id="cycLegend"></div><p class="readout" id="cycRead" aria-live="polite"></p></section>';
}
function updateCycles(){
  var t=ui.cur,host=$('#cycHost');
  if(!host||!t)return;
  var starts=periodStarts(t),cyc=[];
  for(var i=1;i<starts.length;i++)cyc.push({start:starts[i-1].x,end:starts[i].x,len:starts[i].x-starts[i-1].x,dur:starts[i-1].dur});
  ui.cyc=cyc;
  if(ui.csel!=null&&!cyc[ui.csel])ui.csel=null;
  var st='',ro=$('#cycRead'),lg=$('#cycLegend');
  if(cyc.length){
    var lens=cyc.map(function(c){return c.len;}),durs=cyc.map(function(c){return c.dur;});
    var mn=Math.min.apply(null,lens),mx=Math.max.apply(null,lens);
    st+=cyTile(fmtNum(meanOf(lens)),'Average cycle, days')+cyTile(mn===mx?String(mn):mn+'–'+mx,'Shortest to longest')+cyTile(fmtNum(meanOf(durs)),'Average period length, days');
  }
  if(starts.length){
    var ls=starts[starts.length-1].x,since=Math.max(0,dayNum(today())-ls);
    st+=cyTile(String(since),'Days since last start ('+fmtDay(ls,{month:'short',day:'numeric'})+')');
  }
  $('#cycStats').innerHTML=st;
  if(!cyc.length){
    host.innerHTML='<p class="nochart">'+(starts.length
      ?'One period start logged. Your first cycle length appears after the next start.'
      :'Log a day when flow goes from '+esc(t.levels[0])+' to a higher level to mark a period start. Cycle lengths appear after two starts.')+'</p>';
    if(ro)ro.textContent='';
    if(lg)lg.innerHTML='';
    return;
  }
  var t2={type:'bars',xName:'Cycle start',yName:'Days between starts',mode:'sum',rainbow:!!t.rainbow,
    series:[{id:'c',name:'Cycles',color:null,mcolor:t.series[0].mcolor,line:false}],view:{yMin:'',yMax:'',xMin:'',xMax:'',order:'x'}};
  var pts2=cyc.map(function(c,i){var lab=fmtDay(c.start,{month:'short',day:'numeric'});return {i:i,x:lab,y:c.len,xs:lab,k:0,n:1};});
  host.innerHTML=drawChart(t2,host.clientWidth||330,pts2,ui.csel,'c',{y2:{values:cyc.map(function(c){return c.dur;}),name:'Period length, days'}});
  if(lg)lg.innerHTML='<span class="lg"><i class="lgsq" style="background:'+(rbOn(t)?'var(--rainbow)':markColor(t2,0))+'"></i>Days between starts (left axis)</span>'+
    '<span class="lg"><i class="lgm" style="background:var(--card);border-color:var(--ink)"></i>Period length, days (right axis)</span>';
  if(ro){
    var c=cyc[ui.csel];
    ro.textContent=c?('Started '+fmtDay(c.start,{weekday:'short',month:'short',day:'numeric'})+': flow for '+c.dur+(c.dur===1?' day':' days')+', then '+c.len+(c.len===1?' day':' days')+' until the next start on '+fmtDay(c.end,{month:'short',day:'numeric'})+'.'):'Tap a bar to see its dates.';
  }
}

function parseLevels(s){
  var a=String(s).split(',').map(function(x){return x.trim().slice(0,20);}).filter(Boolean);

  var seen=Object.create(null);
  for(var i=0;i<a.length;i++){var k=a[i].toLowerCase();if(seen[k])return null;seen[k]=1;}
  return a;
}

  return headBlock(t)+
    '<div class="plotbar"><button class="btn" data-act="editview" id="editBtn" aria-expanded="'+(ui.editOpen?'true':'false')+'">'+ic('sliders',18)+'Edit view</button></div>'+
    '<div class="card chart'+(rbOn(t)?' rb':'')+'" id="chartHost"></div><div class="legend" id="legend"></div>'+
    '<p class="readout" id="readout" aria-live="polite"></p>'+'<div id="editHost">'+(ui.editOpen?editPanel(t):'')+'</div>'+
    '<form id="entryForm" class="entry" novalidate>'+(t.type==='xy'&&t.series.length>1?'<label class="f ser" for="es"><span class="cap2">Series</span><select id="es">'+seriesOptions(t,ui.entrySid)+'</select></label>':'')+
      '<label class="f" for="ex"><span class="cap2">'+esc(xn(t))+'</span>'+xin+'</label>'+
      '<label class="f" for="ey"><span class="cap2">'+esc(yn(t))+'</span>'+(t.type==='rating'?levelSelect(t,'','id="ey"'):'<input id="ey" type="number" step="any">')+'</label>'+
      '<button class="btn primary add" type="submit" aria-label="Add entry">'+ic('plus',22)+'</button>'+
    '</form>'+
    '<p class="err" id="entErr" role="alert" hidden></p>'+
    '<p class="sub" id="skipNote"></p>'+dl+cycleSection(t);
}

function viewBackup(){
  var json=JSON.stringify({app:'tracker-tabs',version:1,tabs:store.tabs},null,1);
  return '<div class="head"><h1>Backup &amp; restore</h1><p class="sub">Tabs live only on this device. Copy the text below somewhere safe to keep a backup.</p></div>'+
    '<section class="card stack"><h2>Back up</h2><textarea id="bk" readonly rows="6" aria-label="Backup text">'+esc(json)+'</textarea><button class="btn" data-act="copy">Copy backup</button></section>'+
    '<section class="card stack"><h2>Restore</h2><textarea id="rs" rows="4" placeholder="Paste a backup here" aria-label="Paste backup text"></textarea><button class="btn" data-act="restore">Add to my tabs</button><p class="sub" id="rsMsg" role="status"></p></section>';
}

function bodyHtml(){
  if(ui.view==='templates')return viewTemplates();
  if(ui.view==='new')return viewNew();
  if(ui.view==='backup')return viewBackup();
  if(ui.view==='tracker'&&ui.cur)return (ui.mode==='plot'&&ui.cur.stage==='plot')?viewPlot(ui.cur):viewTable(ui.cur);
  return viewHome();
}
function render(){
  if(ui.editFor!==ui.cur){ui.editOpen=false;ui.editFor=ui.cur;}
  $('#app').innerHTML=headerHtml()+'<main class="col">'+bodyHtml()+'</main>';
  if(ui.view==='tracker'&&ui.cur){
    if(ui.mode==='plot'&&ui.cur.stage==='plot')updateChart();else updateRowInfo();
  }
}
function updateRowInfo(){
  var el=$('#rowinfo'),t=ui.cur;
  if(!el||!t)return;
  var g=getPlot(t);
  var bars=t.type==='bars',one=g.pts.length===1;
  el.textContent=g.pts.length+(bars?(one?' bar':' bars'):(one?' row':' rows'))+' ready'+(g.bad?' · '+g.bad+' incomplete (not plotted)':'')+(bars?(t.mode==='latest'?' · the latest entry for a name is used':' · repeated names are added together'):'');
}

/* ---------- dialogs and toast ---------- */
function showDialog(o){
  return new Promise(function(resolve){
    var root=$('#dlg'),prev=document.activeElement,hasIn=!!o.input;
    root.innerHTML='<div class="scrim" data-scrim></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h2 id="dlgT" class="dt">'+esc(o.title)+'</h2>'+
      (o.message?'<p class="dm">'+esc(o.message)+'</p>':'')+
      (hasIn?'<input id="dlgIn" type="text" maxlength="60" autocomplete="off" placeholder="'+esc(o.input.placeholder||'')+'" value="'+esc(o.input.value||'')+'"><p class="err" id="dlgErr" role="alert" hidden></p>':'')+
      '<div class="dbtns">'+o.buttons.map(function(b,i){return '<button type="button" class="btn '+(b.kind||'')+'" data-di="'+i+'">'+esc(b.label)+'</button>';}).join('')+'</div></div>';
    root.hidden=false;
    var inp=$('#dlgIn',root);
    function close(res){
      root.hidden=true;root.innerHTML='';root.onclick=null;
      document.removeEventListener('keydown',onKey,true);
      if(prev&&prev.focus&&document.contains(prev))prev.focus();
      resolve(res);
    }
    function press(i){
      var b=o.buttons[i];
      if(b.needsText){
        var v=inp.value.trim();
        if(!v){var er=$('#dlgErr',root);er.textContent='Type a name first.';er.hidden=false;inp.focus();return;}
        close({value:b.value,text:v});
      }else close({value:b.value,text:inp?inp.value.trim():''});
    }
    function onKey(e){
      if(e.key==='Escape'){e.preventDefault();close({value:null});}
      else if(e.key==='Enter'&&inp&&e.target===inp){
        e.preventDefault();
        for(var i=0;i<o.buttons.length;i++){if(o.buttons[i].kind==='primary'){press(i);break;}}
      }
    }
    document.addEventListener('keydown',onKey,true);
    root.onclick=function(e){
      if(e.target.hasAttribute&&e.target.hasAttribute('data-scrim')){close({value:null});return;}
      var b=e.target.closest('[data-di]');
      if(b)press(+b.getAttribute('data-di'));
    };
    setTimeout(function(){var f=inp||root.querySelector('[data-di]');if(f){f.focus();if(inp)inp.select();}},30);
  });
}
function askName(o){
  return showDialog({title:o.title,input:{value:o.value||'',placeholder:o.placeholder||''},
    buttons:[{label:'Cancel',value:null},{label:o.confirm||'Save',value:'ok',kind:'primary',needsText:true}]})
    .then(function(r){return r.value==='ok'?r.text:null;});
}
var toastT;
function toast(msg){
  var el=$('#toast');
  el.textContent=msg;el.hidden=false;
  clearTimeout(toastT);
  toastT=setTimeout(function(){el.hidden=true;},2800);
}
function closeMenu(){
  var m=$('#menu');
  if(m&&!m.hidden){m.hidden=true;var b=$('#menuBtn');if(b)b.setAttribute('aria-expanded','false');}
}

/* ---------- flow ---------- */
function openTab(id){
  var t=store.tabs.filter(function(x){return x.id===id;})[0];
  if(!t)return;
  ui.cur=t;ui.view='tracker';ui.mode=t.stage==='plot'?'plot':'table';ui.sel=null;
  render();toTop();
}
function resumeDraft(){
  var d=store.draft;
  if(!d)return;
  ui.cur=d;ui.view='tracker';ui.mode=d.stage==='plot'?'plot':'table';ui.sel=null;
  render();toTop();
}
function startNew(type){
  var t=makeTab(type);
  store.draft=t;ui.cur=t;ui.view='tracker';ui.mode='table';ui.sel=null;
  persist();render();toTop();
}
async function saveDraft(){
  var d=store.draft;
  if(!d)return false;
  var name=await askName({title:'Name this tab',value:(d.tpl&&TEMPLATES[d.tpl]?TEMPLATES[d.tpl].name:''),placeholder:'e.g. Morning weight',confirm:'Save'});
  if(!name)return false;
  d.name=name;d.updated=Date.now();
  store.tabs.push(d);store.draft=null;
  persist();
  toast('Saved “'+name+'”');
  return true;
}
async function guardDraft(){
  var d=store.draft;
  if(!d)return true;
  if(!hasData(d)){store.draft=null;persist();return true;}
  var r=await showDialog({title:'Save this tab first?',message:'It has data but no name yet. If you discard it, the data is gone.',
    buttons:[{label:'Discard',value:'discard',kind:'danger'},{label:'Keep editing',value:'keep'},{label:'Save',value:'save',kind:'primary'}]});
  if(r.value==='save')return await saveDraft();
  if(r.value==='discard'){store.draft=null;persist();return true;}
  if(ui.cur!==d)resumeDraft();
  return false;
}
async function go(target){
  closeMenu();
  var leavingDraft=ui.view==='tracker'&&ui.cur&&ui.cur===store.draft;
  if((leavingDraft||target==='new'||target==='templates')&&store.draft){
    if(!(await guardDraft()))return;
  }
  ui.view=target;ui.cur=null;ui.sel=null;
  render();toTop();
}
function runGo(){
  var t=ui.cur,c=TYPES[t.type],err=$('#goErr');
  if(!getPlot(t).pts.length){err.textContent=c.rowMsg;err.hidden=false;return;}
  t.stage='plot';ui.mode='plot';ui.sel=null;touch(t);
  render();toTop();
}
function addEntry(){
  var t=ui.cur,c=TYPES[t.type],ex=$('#ex'),ey=$('#ey'),err=$('#entErr');
  var row={x:ex.value.trim(),y:ey.value.trim()};
  var es=$('#es');
  if(es&&t.type==='xy'){row.s=es.value;ui.entrySid=es.value;}
  var p=parseRow(t,row);
  if(p.blank||p.bad){err.textContent=c.entryMsg;err.hidden=false;return;}
  err.hidden=true;
  while(t.rows.length&&rowBlank(t.rows[t.rows.length-1]))t.rows.pop();
  t.rows.push(row);ensureTrailingBlank(t);
  touch(t);ui.sel=null;updateChart();
  if(t.type==='bars'){
    var key=row.x.toLowerCase();
    ui.pts.forEach(function(q){if(q.xs.toLowerCase()===key&&q.n>1)toast(q.xs+(t.mode==='latest'?' now: ':' total: ')+fmtNum(q.y));});
  }
  ey.value='';
  if(t.type==='time'||t.type==='rating'){ex.value=today();ey.focus();}else{ex.value='';ex.focus();}
  var dl=$('#labels');
  if(dl)dl.innerHTML=uniqueLabels(t).map(function(l){return '<option value="'+esc(l)+'">';}).join('');
}
function mkExample(type,name,xName,yName,rows){
  var t=makeTab(type);
  t.name=name;t.xName=xName;t.yName=yName;
  t.rows=rows.map(function(r){return {x:String(r[0]),y:String(r[1])};});
  t.rows.push({x:'',y:''});
  t.stage='plot';
  return t;
}
function loadExamples(){
  var w=[72.4,72.1,72.3,71.9,72.0,71.8,72.2,71.7,71.6,71.9,71.5,71.4,71.6,71.2],now=new Date();
  var r1=w.map(function(v,i){var d=new Date(now);d.setDate(d.getDate()-(w.length-1-i));return [isoLocal(d),v];});
  store.tabs.push(
    mkExample('time','Example · Morning weight','Date','Weight (kg)',r1),
    mkExample('rating','Example · How I felt','Date','How I felt',r1.map(function(r,i){return [r[0],[2,3,2,1,2,3,3,2,2,3,1,2,3,3][i]];})),
    mkExample('bars','Example · Pantry stock','Item','Count',[['Rice',4],['Lentils',6],['Pasta',3],['Tea',9],['Coffee',2],['Oats',5]]),
    (function(){
      var x=mkExample('xy','Example · Study hours vs score','Hours studied','Test score',[[1,52],[2,58],[3,61],[4,66],[5,64],[6,72],[7,78],[8,81],[9,88]]);
      x.series[0].name='Class A';x.series[0].line=true;
      var b=newSeries(1,'xy');b.name='Class B';b.line=true;x.series.push(b);
      [[1,45],[3,55],[5,59],[7,69],[9,79]].forEach(function(r){x.rows.splice(x.rows.length-1,0,{x:String(r[0]),y:String(r[1]),s:b.id});});
      return x;
    })()
  );
  persist();render();toast('Loaded 4 examples. Delete them any time.');
}
function doRestore(){
  var msg=$('#rsMsg'),o;
  try{o=JSON.parse($('#rs').value);}catch(e){msg.textContent='That text could not be read. Paste the whole backup.';return;}
  var arr=Array.isArray(o)?o:(o&&Array.isArray(o.tabs)?o.tabs:null);
  if(!arr){msg.textContent='That does not look like a Tracker Tabs backup.';return;}
  var n=0;
  arr.forEach(function(x){
    var c=clean(x);
    if(!c||!c.name)return;
    var k=-1;
    store.tabs.forEach(function(y,j){if(y.id===c.id)k=j;});
    if(k>=0)store.tabs[k]=c;else store.tabs.push(c);
    n++;
  });
  persist();
  msg.textContent=n?('Added '+n+(n===1?' tab':' tabs')+'. They are on your Home list.'):'No tabs were found in that text.';
}

async function act(a,el){
  var t=ui.cur;
  switch(a){
    case 'menu':{var m=$('#menu'),open=m.hidden;m.hidden=!open;$('#menuBtn').setAttribute('aria-expanded',String(open));break;}
    case 'nav':await go(el.getAttribute('data-to'));break;
    case 'type':startNew(el.getAttribute('data-type'));break;
    case 'templates':await go('templates');break;
    case 'tpl':startTemplate(el.getAttribute('data-key'));break;
    case 'open':openTab(el.getAttribute('data-id'));break;
    case 'rename':{
      var x=store.tabs.filter(function(y){return y.id===el.getAttribute('data-id');})[0];
      if(!x)break;
      var n=await askName({title:'Rename tab',value:x.name,confirm:'Rename'});
      if(n){x.name=n;touch(x);render();}
      break;
    }
    case 'renamecur':{
      if(!t)break;
      var n2=await askName({title:'Rename tab',value:t.name||'',confirm:'Rename'});
      if(n2){t.name=n2;touch(t);render();}
      break;
    }
    case 'del':{
      var d=store.tabs.filter(function(y){return y.id===el.getAttribute('data-id');})[0];
      if(!d)break;
      var r=await showDialog({title:'Delete this tab?',message:'“'+d.name+'” and its data will be removed. This cannot be undone.',
        buttons:[{label:'Cancel',value:null},{label:'Delete',value:'del',kind:'danger'}]});
      if(r.value==='del'){store.tabs=store.tabs.filter(function(y){return y!==d;});persist();render();toast('Tab deleted');}
      break;
    }
    case 'resume':resumeDraft();break;
    case 'discard':{
      var r2=await showDialog({title:'Discard the unsaved tab?',message:'Its data will be lost.',
        buttons:[{label:'Cancel',value:null},{label:'Discard',value:'discard',kind:'danger'}]});
      if(r2.value==='discard'){store.draft=null;persist();render();}
      break;
    }
    case 'save':if(await saveDraft())render();break;
    case 'toggle':ui.mode=ui.mode==='plot'?'table':'plot';ui.sel=null;render();toTop();break;
    case 'run':runGo();break;
    case 'rowdel':{
      if(!t)break;
      t.rows.splice(+el.getAttribute('data-i'),1);
      ensureTrailingBlank(t);
      $('#tb').innerHTML=t.rows.map(function(r,i){return rowHtml(t,r,i);}).join('');
      updateRowInfo();touch(t);
      break;
    }
    case 'editview':{
      ui.editOpen=!ui.editOpen;
      var eh=$('#editHost');if(eh)eh.innerHTML=(ui.editOpen&&t)?editPanel(t):'';
      var eb=$('#editBtn');if(eb)eb.setAttribute('aria-expanded',String(ui.editOpen));
      break;
    }
    case 'addseries':{
      if(t&&t.type==='xy'&&t.series.length<6){t.series.push(newSeries(t.series.length,'xy'));touch(t);render();}
      break;
    }
    case 'rmseries':{
      var rid=el.getAttribute('data-sid'),rk=-1;
      t.series.forEach(function(s,j){if(s.id===rid)rk=j;});
      if(rk<0||t.series.length<2)break;
      var cnt=t.rows.filter(function(r){return !rowBlank(r)&&seriesOf(t,r)===rk;}).length;
      var rr=await showDialog({title:'Remove '+sname(t,rk)+'?',
        message:cnt?('Its '+cnt+(cnt===1?' entry':' entries')+' will be removed too. This cannot be undone.'):'This series has no entries.',
        buttons:[{label:'Cancel',value:null},{label:'Remove',value:'rm',kind:'danger'}]});
      if(rr.value==='rm'){
        t.rows=t.rows.filter(function(r){return seriesOf(t,r)!==rk;});
        t.series.splice(rk,1);ensureTrailingBlank(t);ui.sel=null;ui.entrySid=null;touch(t);render();
      }
      break;
    }
    case 'creset':{
      var sr2=t.series.filter(function(s){return s.id===el.getAttribute('data-sid');})[0];
      if(sr2){sr2[el.getAttribute('data-key')]=null;touch(t);render();}
      break;
    }
    case 'viewreset':{t.view.yMin='';t.view.yMax='';t.view.xMin='';t.view.xMax='';touch(t);render();break;}
    case 'examples':loadExamples();break;
    case 'pt':{var i=+el.getAttribute('data-i');ui.sel=ui.sel===i?null:i;updateChart();break;}
    case 'cpt':{var ci=+el.getAttribute('data-i');ui.csel=ui.csel===ci?null:ci;updateCycles();break;}
    case 'copy':{
      var ta=$('#bk');
      try{await navigator.clipboard.writeText(ta.value);toast('Backup copied');}
      catch(e){ta.focus();ta.select();toast('Press and hold to copy the selected text');}
      break;
    }
    case 'restore':doRestore();break;
  }
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  if(!e.target.closest('.menuwrap'))closeMenu();
  var el=e.target.closest('[data-act]');
  if(el)act(el.getAttribute('data-act'),el);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu();});
var app=$('#app');
app.addEventListener('input',function(e){
  var t=ui.cur,el=e.target;
  if(!t)return;
  if(el.id==='vRainbow'){t.rainbow=el.checked;touch(t);render();return;}
  if(el.id==='vFloor'){t.floor=el.checked;touch(t);updateChart();return;}
  if(el.id==='bmode'){
    t.mode=el.value==='latest'?'latest':'sum';touch(t);
    var bh=$('#bmodeHint');if(bh)bh.textContent=modeHint(t);
    if($('#chartHost'))updateChart();else updateRowInfo();
    return;
  }
  if(el.id==='es'){ui.entrySid=el.value;return;}
  var sidN=el.getAttribute('data-sname');
  if(sidN){
    var srN=t.series.filter(function(s){return s.id===sidN;})[0];
    if(srN){srN.name=el.value.slice(0,30);touch(t);syncSeriesNames();}
    return;
  }
  var skey=el.getAttribute('data-sk');
  if(skey){
    var srK=t.series.filter(function(s){return s.id===el.getAttribute('data-sid');})[0];
    if(!srK)return;
    if(skey==='line')srK.line=el.checked;
    else if(HEX.test(el.value))srK[skey]=el.value;
    touch(t);updateChart();
    return;
  }
  var vkey=el.getAttribute('data-v');
  if(vkey){
    t.view[vkey]=el.value;touch(t);updateChart();
    var vw2=$('#vWarn');if(vw2)vw2.textContent=parseView(t).warn.join(' ');
    return;
  }
  if(el.id==='vOrder'){t.view.order=el.value==='entry'?'entry':'x';touch(t);updateChart();return;}
  if(el.id==='levels'){
    var lv=parseLevels(el.value),hint=$('#lvHint');
    if(!lv){hint.textContent='Enter 2 to 7 different levels, separated by commas.';hint.classList.add('err');return;}
    t.levels=lv;hint.classList.remove('err');hint.textContent=levelHint(lv)+'. Separate levels with commas, 2 to 7 of them.';
    $('#tb').innerHTML=t.rows.map(function(r,i){return rowHtml(t,r,i);}).join('');
    updateRowInfo();touch(t);return;
  }
  if(el.id==='xName'||el.id==='yName'){
    var v=el.value.slice(0,40);
    if(el.id==='xName')t.xName=v;else t.yName=v;
    var th=$(el.id==='xName'?'[data-xn]':'[data-yn]');
    if(th)th.textContent=el.id==='xName'?xn(t):yn(t);
    touch(t);
    return;
  }
  if(el.getAttribute('data-f')&&el.closest('#tb')){
    var tr=el.closest('tr'),i=+tr.getAttribute('data-r');
    t.rows[i][el.getAttribute('data-f')]=el.value;
    var blank=rowBlank(t.rows[i]);
    tr.querySelector('.xbtn').classList.toggle('off',blank);
    if(i===t.rows.length-1&&!blank){
      t.rows.push({x:'',y:''});
      $('#tb').insertAdjacentHTML('beforeend',rowHtml(t,t.rows[t.rows.length-1],t.rows.length-1));
    }
    updateRowInfo();touch(t);
  }
});
app.addEventListener('change',function(e){
  var el=e.target;
  if(el.type==='color'&&el.getAttribute('data-sk'))render();
});
app.addEventListener('submit',function(e){
  if(e.target.id==='entryForm'){e.preventDefault();addEntry();}
});
var rz;
window.addEventListener('resize',function(){
  clearTimeout(rz);
  rz=setTimeout(function(){if(ui.view==='tracker'&&ui.mode==='plot')updateChart();},150);
});

load();
render();
})();
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
